name: GitHub Pages

# main dalına her gönderimde (ve 6 saatte bir) tek dosyalık uygulamayı GitHub Pages'te yayınlar.
# Site, canlı ligi kendi kendine oynatır (src/07_live.js); 6 saatlik yayın yalnızca live-state.json
# checkpoint'ini tazeler, böylece siteye ilk girenler geçmiş maçları baştan hesaplamak zorunda kalmaz.
# Depo ayarlarında: Settings → Pages → Source: "GitHub Actions" seçilmelidir.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Derle
        run: |
          mkdir -p dist
          ./build.sh dist/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Canlı lig checkpoint'i (yalnızca hızlandırır; başarısız olursa site yine çalışır)
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node tools/live-state.js dist/live-state.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
