name: GitHub Pages

# Tek dosyalık uygulamayı GitHub Pages'te yayınlar: main dalına her gönderimde ve 15 dakikada bir.
# Site, canlı ligi kendi kendine oynatır (src/07_live.js). 15 dakikalık yayın yalnızca live-state.json
# checkpoint'ini tazeler: siteye ilk girenler en fazla son birkaç maçı kendileri hesaplar.
# Checkpoint tarayıcısız üretilir (Node, ~15 sn) ve yayındaki son checkpoint'ten devam eder.
# Yeni bir lig (CONFIG.LIVE.salt değişti) ilk yayınında, yayından birkaç dakika sonra başlar (tools/live-start.js,
# live-start.json; eski ligin şampiyonları ve biten sezonları Geçmiş sekmesine taşınır).
# Simülasyon değişirse lig SIFIRLANMAZ: yayındaki son checkpoint yeni sitenin "tabanı" olur (tools/live-base.js,
# live-base.json) ve yeni kurallar o durumdan devam eder. Yayındaki dosyalar okunamazsa yayın durur (lig yanlışlıkla
# sıfırlanmasın; 15 dk sonra yeniden denenir).
# Repo herkese açık olduğu için Actions dakikaları ücretsizdir.
# Depo ayarlarında: Settings → Pages → Source: "GitHub Actions" seçilmelidir.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Canlı lig başlangıcı (yeni lig yayından birkaç dk sonra başlar; başarısız olursa yayın DURUR)
        env:
          LIVE_URL: ${{ steps.pages.outputs.base_url }}/
        run: node tools/live-start.js dist/live-start.json
      - name: Canlı lig tabanı (kural değiştiyse ligi dondurur; başarısız olursa yayın DURUR)
        env:
          LIVE_URL: ${{ steps.pages.outputs.base_url }}/
        run: node tools/live-base.js dist/live-base.json
      - name: Derle (public/ altındaki manifest, simgeler ve paylaşım görseli dist/'e kopyalanır)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: LIVE_BASE=dist/live-base.json LIVE_START_FILE=dist/live-start.json ./build.sh dist/index.html
      - name: Canlı lig checkpoint'i (yalnızca hızlandırır; başarısız olursa site yine çalışır)
        continue-on-error: true
        env:
          LIVE_URL: ${{ steps.pages.outputs.base_url }}/
        run: node tools/live-state.js dist/live-state.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
